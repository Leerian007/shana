server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: shana
  config:
    # 本地密钥文件（见 .gitignore）；文件不存在时忽略，不影响他人启动
    import: optional:classpath:application-secret.yml
  profiles:
    # 本地默认使用 dev；部署时通过 --spring.profiles.active=prod 覆盖
    default: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # 异步任务线程池：目前只有长期记忆摘要会用到。
  # 队列刻意给得不大——摘要任务堆积说明上游模型慢，继续收只会让延迟雪崩；
  # 队列满时提交会失败，由调用方吞掉，摘要游标未推进，下次对话会重新触发。
  task:
    execution:
      thread-name-prefix: shana-async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 200

  # 数据库已成为会话持久化的必需依赖：Hikari 在首次真正取连接时才建连，
  # initialization-fail-timeout = -1 让"连接池初始化"不阻塞启动，
  # 但 Flyway 迁移会在启动期真正连库，数据库不可用时应用会明确失败（比带病运行好排查）。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shana}
    username: ${DB_USER:shana}
    password: ${DB_PASSWORD:shana}
    hikari:
      pool-name: shana-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      initialization-fail-timeout: -1
      connection-timeout: 5000

  # 表结构由 SQL 脚本管理，脚本位于 shana-infrastructure/src/main/resources/db/migration
  # 临时想跳过迁移（例如只想跑一次离线演示）时设 FLYWAY_ENABLED=false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

shana:
  # 由 Maven 资源过滤注入（spring-boot-starter-parent 对 application*.yml 生效）
  version: @project.version@
  memory:
    # 上下文存储：jdbc（PostgreSQL，默认，保留全量历史）/ redis（多实例共享的热窗口）/ memory（进程内，测试与离线演示用）
    store: ${SHANA_MEMORY_STORE:jdbc}
    # 单个群聊一次对话读取（喂给模型）的最近消息条数；只影响读取，不删除历史
    max-messages: 20
    # 仅 store=redis 生效：会话在 Redis 中的存活时间，每次写入都会续期
    ttl: ${SHANA_MEMORY_TTL:24h}
    # 长期记忆（对话摘要 + 关键信息抽取）只在 store=jdbc 下生效：
    # 没有完整历史就无从摘要，Redis/内存模式会自动跳过，不影响问答
    summary:
      # 未消化的消息攒够多少条才触发一次摘要。太小会让模型调用过于频繁，太大则记忆滞后
      trigger-messages: ${SHANA_MEMORY_SUMMARY_TRIGGER:20}
      # 单次喂给模型的原文上限，超出的部分下一轮继续消化（摘要游标会推进）
      batch-size: ${SHANA_MEMORY_SUMMARY_BATCH:50}
  llm:
    # 使用哪一类模型来源，决定 LlmClientRegistry 里选哪个适配器
    provider: ${SHANA_LLM_PROVIDER:OPENAI_COMPATIBLE}
    openai-compatible:
      # OpenAI / DeepSeek / 通义 / 本地 vLLM 都兼容该协议，换厂商只改下面三行
      base-url: ${SHANA_LLM_BASE_URL:https://api.deepseek.com/v1}
      model: ${SHANA_LLM_MODEL:deepseek-chat}
      # 没有 key 时适配器不会装配，接口返回“服务暂不可用”，但工程仍能正常启动
      api-key: ${SHANA_LLM_API_KEY:}
      temperature: ${SHANA_LLM_TEMPERATURE:0.7}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  # 数据库已接入会话持久化，健康检查随之打开：连不上时 Actuator 会如实报 DOWN
  # Redis 只在 SHANA_MEMORY_STORE=redis 时才是必需依赖，默认关闭这项检查，
  # 避免 jdbc 模式下因为本机没装 Redis 而误报 DOWN；切到 redis 模式后设 SHANA_REDIS_HEALTH=true
  health:
    db:
      enabled: true
    redis:
      enabled: ${SHANA_REDIS_HEALTH:false}

logging:
  level:
    root: info
    com.shana: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
